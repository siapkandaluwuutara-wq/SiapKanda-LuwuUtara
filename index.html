<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAP KANDA - Portal Transmigrasi Terpadu Luwu Utara</title>
    <meta name="description" content="Sistem Informasi Data Administrasi Pengembangan Kawasan Transmigrasi Terpadu Kabupaten Luwu Utara untuk pemantauan data kependudukan, sertifikasi tanah, komoditas, dan infrastruktur secara real-time dan transparan." />
    <meta property="og:title" content="SIAP KANDA - Portal Transmigrasi Terpadu Luwu Utara" />
    <meta property="og:description" content="Sistem Informasi Data Administrasi Pengembangan Kawasan Transmigrasi Terpadu Kabupaten Luwu Utara untuk pemantauan data kependudukan, sertifikasi tanah, komoditas, dan infrastruktur secara real-time dan transparan." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./Luwu_Utara_Logo_(North_Luwu).png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // 1. GitHub Pages Auto-Router & Trailing Slash Guard
      (function() {
        try {
          var loc = window.location;
          var host = loc.hostname;
          var isGitHub = host.endsWith('github.io');

          // Jika dibuka di GitHub Pages pada root repositori (bukan /docs/),
          // dan file ini adalah uncompiled source, otomatis arahkan ke /docs/ di mana bundel produksi berada!
          if (isGitHub && !loc.pathname.includes('/docs/')) {
            var segments = loc.pathname.split('/').filter(Boolean);
            if (segments.length >= 1) {
              var repo = segments[0];
              var target = '/' + repo + '/docs/' + loc.search + loc.hash;
              loc.replace(target);
              return;
            }
          }

          // Normalisasi trailing slash agar path relatif ./assets/ terbaca benar
          var path = loc.pathname;
          if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
            var newUrl = loc.protocol + '//' + loc.host + path + '/' + loc.search + loc.hash;
            loc.replace(newUrl);
            return;
          }

          // Pemulihan Redirect SPA dari 404.html jika ada
          if (window.sessionStorage) {
            var redirect = sessionStorage.getItem('siapkanda_redirect');
            if (redirect) {
              sessionStorage.removeItem('siapkanda_redirect');
              if (redirect !== location.href) {
                history.replaceState(null, null, redirect);
              }
            }
          }
        } catch(e) {
          console.warn('GitHub Pages routing guard:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded Preloader: Menghilangkan Layar Putih & Memastikan Visual Resmi Tampil -->
      <div id="siapkanda-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #f8fafc; padding: 24px; text-align: center;">
        <div style="width: 76px; height: 76px; margin-bottom: 20px; border-radius: 20px; background: rgba(16, 185, 129, 0.15); border: 1.5px solid rgba(16, 185, 129, 0.35); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); position: relative;">
          <!-- Inline SVG Lambang Daerah Luwu Utara (Tampil 100% tanpa risiko 404 image) -->
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div style="font-size: 22px; font-weight: 800; color: #34d399; letter-spacing: -0.02em; margin-bottom: 4px;">
          SIAP KANDA
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #94a3b8; max-width: 340px; margin-bottom: 24px; line-height: 1.5;">
          Portal Administrasi & Peta Kawasan Transmigrasi Terpadu Kabupaten Luwu Utara
        </div>
        <div id="siapkanda-loader-pill" style="display: flex; align-items: center; gap: 10px; background: rgba(30, 41, 59, 0.85); border: 1px solid #334155; padding: 8px 18px; border-radius: 9999px; font-size: 12px; color: #cbd5e1;">
          <div style="width: 14px; height: 14px; border: 2px solid #334155; border-top-color: #10b981; border-radius: 50%; animation: siap-loader-spin 0.75s linear infinite;"></div>
          <span id="siapkanda-loader-text">Memuat sistem & data kawasan...</span>
        </div>

        <!-- Tombol Bantuan Pemulihan Otomatis Jika di GitHub Pages Root -->
        <div id="siapkanda-timeout-helper" style="display: none; margin-top: 24px;">
          <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">Pemuatan membutuhkan waktu lebih lama atau aplikasi belum muncul?</p>
          <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="goToDocs()" style="background: #10b981; color: #ffffff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
              Buka Versi Dashboard (/docs)
            </button>
            <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="background: #334155; color: #e2e8f0; border: none; padding: 9px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">
              Reset Cache & Muat Ulang
            </button>
          </div>
        </div>
      </div>
      <style>
        @keyframes siap-loader-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <script>
        function goToDocs() {
          var loc = window.location;
          var segments = loc.pathname.split('/').filter(Boolean);
          var repo = segments[0] || '';
          loc.replace('/' + repo + '/docs/' + loc.search + loc.hash);
        }

        // Tampilkan tombol pemulihan jika script belum selesai dalam 3 detik
        setTimeout(function() {
          var helper = document.getElementById('siapkanda-timeout-helper');
          if (helper) helper.style.display = 'block';
        }, 3000);
      </script>
    </div>

    <!-- Script Utama Aplikasi -->
    <script type="module" src="./src/main.tsx" onerror="handleMainScriptError()"></script>
    <script>
      function handleMainScriptError() {
        console.warn('Gagal memuat src/main.tsx langsung. Mengalihkan ke versi terkompilasi...');
        var loc = window.location;
        if (loc.hostname.endsWith('github.io') && !loc.pathname.includes('/docs/')) {
          goToDocs();
        }
      }
    </script>
  </body>
</html>
