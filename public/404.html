<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>SIAP KANDA - Portal Transmigrasi Luwu Utara</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        try {
          var l = window.location;
          sessionStorage.setItem('siapkanda_redirect', l.href);
          // Redirect to base path
          var pathSegments = l.pathname.split('/').filter(Boolean);
          var basePath = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
          l.replace(l.protocol + '//' + l.host + basePath);
        } catch (e) {
          window.location.replace('./');
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='./'">
  </head>
  <body style="font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc;">
    <div style="text-align: center;">
      <h3 style="color: #34d399; margin-bottom: 8px;">SIAP KANDA Luwu Utara</h3>
      <p style="color: #94a3b8; font-size: 13px;">Mengarahkan kembali ke portal utama...</p>
    </div>
  </body>
</html>
